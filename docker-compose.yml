services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      USE_FIXTURES: ${USE_FIXTURES:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      # Live-reload corpus / pipeline while iterating in Cursor
      - ./src:/app/src
      - ./docs:/app/docs
      - ./eval:/app/eval
