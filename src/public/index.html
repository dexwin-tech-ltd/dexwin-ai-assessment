<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northline Ops Assistant</title>
    <style>
      :root {
        --bg: #0f1419;
        --panel: #171e26;
        --ink: #e8eef4;
        --muted: #93a1b0;
        --line: #2a3542;
        --accent: #3d9cf0;
        --good: #3ecf8e;
        --bad: #f07178;
        --warn: #e6b450;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        padding: 20px 24px 12px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
      }
      h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
      .sub { color: var(--muted); font-size: 13px; }
      .badge {
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--warn);
        white-space: nowrap;
      }
      .badge.live { color: var(--good); }
      main { max-width: 880px; margin: 0 auto; padding: 24px; }
      label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      textarea {
        width: 100%;
        min-height: 88px;
        resize: vertical;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
      }
      .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      button {
        background: var(--accent);
        color: #061018;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        font: 600 13px/1 inherit;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      button:disabled { opacity: 0.5; cursor: wait; }
      section {
        margin-top: 22px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
      }
      h2 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 600; }
      pre {
        white-space: pre-wrap;
        margin: 0;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .chunk {
        border-top: 1px solid var(--line);
        padding: 10px 0;
        color: var(--muted);
      }
      .chunk:first-child { border-top: 0; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
      .pass { color: var(--good); }
      .fail { color: var(--bad); }
      .err { color: var(--bad); }
      .samples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .samples button { font-weight: 500; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Northline Ops Assistant</h1>
        <div class="sub">Internal FAQ baseline — Dexwin live AI assessment</div>
      </div>
      <div id="mode" class="badge">checking…</div>
    </header>
    <main>
      <label for="q">Ask a policy question</label>
      <textarea id="q" placeholder="How much PTO do full-time employees accrue per year?"></textarea>
      <div class="row">
        <button id="ask">Ask</button>
        <button id="eval" class="secondary">Run eval set</button>
      </div>
      <div class="samples">
        <button class="secondary" data-q="How much PTO do full-time employees accrue per year?">PTO</button>
        <button class="secondary" data-q="What is the expense report deadline?">Expenses</button>
        <button class="secondary" data-q="What is Northline's current stock price?">Stock (should refuse)</button>
        <button class="secondary" data-q="Should I email customer PII to a vendor to speed up onboarding?">PII to vendor</button>
      </div>

      <section>
        <h2>Answer</h2>
        <pre id="answer">Ask something, or run the eval set.</pre>
      </section>
      <section>
        <h2>Retrieved chunks (baseline retrieval)</h2>
        <div id="chunks"><div class="chunk">Nothing retrieved yet.</div></div>
      </section>
      <section>
        <h2>Eval</h2>
        <div id="evalout" class="sub">Not run in this session.</div>
      </section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);

      async function health() {
        const r = await fetch("/api/health");
        const h = await r.json();
        const el = $("mode");
        el.textContent = h.fixtureMode
          ? `Fixture mode · ${h.docs} docs · ${h.chunks} chunks`
          : `Live API · ${h.model} · ${h.docs} docs`;
        el.classList.toggle("live", !h.fixtureMode);
      }

      async function ask() {
        const question = $("q").value.trim();
        if (!question) return;
        $("ask").disabled = true;
        $("answer").textContent = "Thinking…";
        try {
          const r = await fetch("/api/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || r.statusText);
          $("answer").textContent = data.answer;
          $("chunks").innerHTML = (data.retrieved || []).length
            ? data.retrieved
                .map(
                  (c) =>
                    `<div class="chunk">score ${c.score ?? "?"} · ${escapeHtml(c.text)}${c.source ? ` <em>(${escapeHtml(c.source)})</em>` : ""}</div>`,
                )
                .join("")
            : `<div class="chunk">No chunks retrieved.</div>`;
        } catch (e) {
          $("answer").innerHTML = `<span class="err">${escapeHtml(e.message)}</span>`;
        } finally {
          $("ask").disabled = false;
        }
      }

      async function runEval() {
        $("eval").disabled = true;
        $("evalout").textContent = "Scoring…";
        try {
          const r = await fetch("/api/eval", { method: "POST" });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || r.statusText);
          const rows = data.results
            .map(
              (row) =>
                `<tr><td class="${row.pass ? "pass" : "fail"}">${row.pass ? "PASS" : "FAIL"}</td><td>${escapeHtml(row.id)}</td><td>${escapeHtml(row.reason)}</td></tr>`,
            )
            .join("");
          $("evalout").innerHTML = `<p><strong>${data.passed}/${data.total}</strong> · ${escapeHtml(data.summary)}</p>
            <table><thead><tr><th></th><th>id</th><th>why</th></tr></thead><tbody>${rows}</tbody></table>`;
        } catch (e) {
          $("evalout").innerHTML = `<span class="err">${escapeHtml(e.message)}</span>`;
        } finally {
          $("eval").disabled = false;
        }
      }

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      $("ask").addEventListener("click", ask);
      $("eval").addEventListener("click", runEval);
      document.querySelectorAll("[data-q]").forEach((b) =>
        b.addEventListener("click", () => {
          $("q").value = b.getAttribute("data-q");
          ask();
        }),
      );
      $("q").addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") ask();
      });
      health();
    </script>
  </body>
</html>
